timezone: America/Los_Angeles
colour: "#4f6fa0"
featured: "1916"

eras:
  - id: "1916"
    label: Montavilla / Linnemann Jct – Ruby Jct – Troutdale
    days: daily
    source: trout-route-1916
    notes:
      - Two branches meet at Ruby Junction - trains run from Montavilla or from Linnemann Junction.
        Train 66 waits at Ruby Junction (7:30 to 7:41) for train 398 from Linnemann Junction.
      - Trains 64 and 63 ran daily except Sunday.
      - Times as printed at the timepoints; stations between are estimated by distance.

